[build-system]
requires = ["hatchling<=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "gloryxr"
version = "0.1.0"
description = "The next generation of the GLORYx metabolite prediction system"
readme = "README.rst"
requires-python = ">=3.13"
license = "GPL-3.0"
authors = [
    { name = "Leo Gaskin", email = "leo.gaskin@univie.ac.at" },
    { name = "Roxane Jacob", email = "roxane.axel.jacob@univie.ac.at" },
]

dependencies = [
    "cdpkit>=1.2.3",
    "fame3r>=2.0.0",
    "rdkit>=2025.3.3",
]

[dependency-groups]
build = ["build"]
tests = [
    "pytest>=8.4.1",
    "syrupy>=4.9.1",
]
docs = [
    "sphinx>=8.2.3",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
]
full = [ # maybe this needs to go to optional dependencies?
    "molvs>=0.1.1",
    "pandas>=2.3.0",
    "tqdm>=4.67.1",
    "scikit-learn>=1.7.0",
    # "httpx>=0.28.1",
]
dev = [
    "fame3r[cli]",
    "basedpyright>=1.29.4",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "jupyter-ruff>=0.3.0",
    "matplotlib>=3.10.8",
    "ruff>=0.11.13",
    { include-group = "build" },
    { include-group = "tests" },
    { include-group = "docs" },
    { include-group = "full" },
]

[tool.hatch.build.targets.sdist]
include = ["gloryxr"]

[tool.hatch.build.targets.wheel]
include = ["gloryxr"]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.pyright]
typeCheckingMode = "basic"
exclude = [".venv", "**/*.ipynb"]

[tool.ruff.lint]
extend-select = ["I"]
