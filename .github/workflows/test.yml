name: Test

on:
  push:
    branches: master
  pull_request:
    branches: '*'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", ""]
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - run: uv sync --all-extras
    - run: uv run python -m pytest -vv
